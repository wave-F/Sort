<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>刀切水果 - three.js WebGPU</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/webgpu": "./node_modules/three/build/three.webgpu.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="phone-frame">
      <div id="bg-art" aria-hidden="true">
        <div class="bg-sky"></div>
        <div class="bg-hills"></div>
        <div class="bg-forest"></div>
      </div>

      <div id="hud">
        <div id="score">分数: 0</div>
        <label class="trail-test-toggle">
          <input id="trail-compare-toggle" type="checkbox" checked />
          完整保留轨迹（测试）
        </label>
      </div>

      <button id="control-btn" type="button" aria-label="打开控制面板">控制</button>
      <div id="control-blocker" class="hidden" aria-hidden="true"></div>

      <div id="control-panel" class="panel-light hidden" role="dialog" aria-label="控制面板">
        <h3>控制面板</h3>

        <label class="control-row">
          <span>刀光宽度</span>
          <input id="ctl-trail-width" type="range" min="0.06" max="0.22" step="0.01" value="0.12" />
          <em id="ctl-trail-width-value">0.12</em>
        </label>

        <label class="control-row">
          <span>水花尺寸</span>
          <input id="ctl-particle-size" type="range" min="0.04" max="0.22" step="0.01" value="0.09" />
          <em id="ctl-particle-size-value">0.09</em>
        </label>

        <label class="control-row">
          <span>单果分数</span>
          <input id="ctl-score-fruit" type="range" min="1" max="15" step="1" value="5" />
          <em id="ctl-score-fruit-value">5</em>
        </label>

        <fieldset class="control-group">
          <legend>九宫格切片边界</legend>

          <label class="control-row">
            <span>切片上</span>
            <input id="ctl-panel-margin-top" type="range" min="8" max="64" step="1" value="28" />
            <em id="ctl-panel-margin-top-value">28</em>
          </label>

          <label class="control-row">
            <span>切片右</span>
            <input id="ctl-panel-margin-right" type="range" min="8" max="64" step="1" value="28" />
            <em id="ctl-panel-margin-right-value">28</em>
          </label>

          <label class="control-row">
            <span>切片下</span>
            <input id="ctl-panel-margin-bottom" type="range" min="8" max="64" step="1" value="28" />
            <em id="ctl-panel-margin-bottom-value">28</em>
          </label>

          <label class="control-row">
            <span>切片左</span>
            <input id="ctl-panel-margin-left" type="range" min="8" max="64" step="1" value="28" />
            <em id="ctl-panel-margin-left-value">28</em>
          </label>
        </fieldset>

        <div class="control-actions">
          <button id="control-save-btn" type="button">保存</button>
          <button id="show-result-btn" type="button">结果页</button>
          <button id="control-close-btn" type="button">关闭</button>
        </div>
      </div>

      <div id="commentary">开始后，先锁定一种颜色再连切。</div>

      <div id="start-screen" class="layer">
        <div class="ladder-stage">
          <div class="ladder-rail" aria-label="关卡天梯">
            <div class="ladder-rail-shine"></div>
            <div class="ladder-nodes">
              <div class="ladder-node"><span>1</span></div>
              <div class="ladder-node"><span>2</span></div>
              <div class="ladder-node"><span>3</span></div>
              <div class="ladder-node"><span>4</span></div>
              <div class="ladder-node"><span>5</span></div>
              <div class="ladder-node"><span>6</span></div>
              <div class="ladder-node"><span>7</span></div>
              <div class="ladder-node"><span>8</span></div>
              <div class="ladder-node"><span>9</span></div>
              <div class="ladder-node"><span>10</span></div>
            </div>
          </div>

          <button id="start-btn">开始</button>
        </div>
      </div>

      <div id="pause-overlay" class="layer hidden">断刀暂停 - 点一下继续</div>

      <div id="game-over" class="layer hidden">
        <div class="game-over-card panel-light">
          <h2 id="game-over-title">本局结束</h2>
          <button id="restart-btn">再来一局</button>
        </div>
      </div>

      <div id="result-page" class="layer hidden">
        <div class="result-card panel-light">
          <h2>结果页</h2>
          <p id="result-page-text">当前暂无统计。</p>
          <button id="result-back-btn" type="button">返回游戏</button>
        </div>
      </div>

      <div id="app"></div>
    </div>

    <script type="module" src="./src/main.js?v=35"></script>
  </body>
</html>
