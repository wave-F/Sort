<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>切泡泡 - three.js WebGPU</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/webgpu": "./node_modules/three/build/three.webgpu.js",
          "three/tsl": "./node_modules/three/build/three.tsl.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="phone-frame">
      <div id="bg-art" aria-hidden="true"></div>

      <button id="battle-exit-btn" type="button" class="hidden" aria-label="退出到开始页"></button>

      <div id="coin-status" class="coin-hud" aria-label="金币状态栏">
        <img id="coin-status-icon" class="coin-icon" src="./assets/images/currency128_Coin.png" alt="金币" />
        <span id="coin-value">16</span>
      </div>

      <div id="hud">
        <div id="score">步数: -</div>
        <div id="slice-state">状态: 待机</div>
      </div>

      <div id="level-test">
        <button id="level-test-toggle" class="tool-btn" type="button">测试关卡</button>
        <div id="level-test-panel" class="hidden">
          <label for="level-test-select">选择关卡</label>
          <select id="level-test-select"></select>
          <button id="level-test-jump" class="tool-btn" type="button">切换到该关</button>
        </div>
      </div>

      <div id="commentary">开始后，先锁定一种颜色再连戳。</div>

      <div id="start-screen" class="layer start-screen">
        <div class="ladder-stage">
          <h1 id="start-title" class="hidden">切泡泡</h1>
          <p id="start-subtitle" class="hidden">已解锁到第1关，共10关</p>
          <div class="start-ladder-rail" aria-label="关卡天梯">
            <div class="start-ladder-shine"></div>
            <div id="start-ladder" class="start-ladder"></div>
          </div>
          <button id="start-btn" class="start-btn" type="button">开始</button>
        </div>
      </div>

      <div id="pause-overlay" class="layer hidden">断刀暂停 - 点一下继续</div>

      <div id="result-mask" class="hidden"></div>
      <div id="result-page" class="layer hidden result-page is-win">
        <div class="result-card panel-light">
          <h2 id="result-title" class="panel-title-ribbon is-lose"><span id="result-title-text">失败</span></h2>
          <img id="result-coin-icon" class="result-coin hidden" src="./assets/images/currency128_Coin.png" alt="金币" />
          <div id="result-reward" class="result-reward hidden">+0</div>
          <p id="result-desc">当前暂无统计。</p>
          <div class="result-actions">
            <button id="result-retry-btn" class="result-btn hidden" type="button">重试</button>
            <button id="result-next-btn" class="result-btn" type="button">下一关</button>
            <button id="result-back-btn" class="result-btn result-btn-secondary" type="button">返回</button>
          </div>
        </div>
      </div>

      <div id="coin-fly-layer" class="hidden"></div>

      <div id="app"></div>
    </div>

    <script type="module" src="./src/main.js?v=25"></script>
  </body>
</html>
