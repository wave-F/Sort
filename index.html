<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>切泡泡 - three.js WebGPU</title>
    <link rel="stylesheet" href="./src/styles.css?v=2" />
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/webgpu": "./node_modules/three/build/three.webgpu.js",
          "three/tsl": "./node_modules/three/build/three.tsl.js",
          "countup.js": "./node_modules/countup.js/dist/countUp.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="phone-frame">
      <div id="coin-status">
        <img class="coin-icon" src="./assets/images/currency128_Coin.png" alt="金币" />
        <span id="coin-status-text">0</span>
      </div>
      <div id="coin-fly-layer" class="hidden" aria-hidden="true"></div>

      <div id="hud">
        <div id="score">步数: -</div>
      </div>

      <div id="level-test">
        <button id="level-test-toggle" class="tool-btn" type="button">测试关卡</button>
        <div id="level-test-panel" class="hidden">
          <label for="level-test-select">选择关卡</label>
          <select id="level-test-select"></select>

          <fieldset class="level-test-group">
            <legend>步数</legend>
            <button id="level-test-next-step" class="tool-btn" type="button">测试流程1(最大联通区域)</button>
            <button id="level-test-export-step" class="tool-btn" type="button">计算并导出步数</button>
            <label class="level-test-switch" for="level-test-hex-toggle">
              <input id="level-test-hex-toggle" type="checkbox" />
              <span>显示六边形</span>
            </label>
          </fieldset>
        </div>
      </div>

      <div id="commentary">开始后，先锁定一种颜色再连戳。</div>

      <div id="home-screen" class="layer">
        <div id="home-topbar">
          <div class="home-status home-status-energy" aria-label="体力状态">
            <span class="home-status-badge" aria-hidden="true">❤</span>
            <span id="home-energy-text" class="home-status-value">FULL</span>
          </div>

          <div class="home-status home-status-coin" aria-label="金币数量">
            <img class="home-status-badge coin" src="./assets/images/currency128_Coin.png" alt="金币" />
            <span id="home-coin" class="home-status-value">0</span>
          </div>

          <button id="home-settings-btn" class="home-mini-btn" type="button">⚙️</button>
        </div>

        <div id="home-ui-panel" class="hidden" aria-label="主界面样式调控">
          <label class="home-ui-row" for="home-ui-energy-size">
            <span>体力字大小</span>
            <input id="home-ui-energy-size" type="range" min="14" max="42" step="1" value="22" />
            <em id="home-ui-energy-size-value">22</em>
          </label>
          <label class="home-ui-row" for="home-ui-energy-x">
            <span>体力字X</span>
            <input id="home-ui-energy-x" type="range" min="-80" max="80" step="1" value="0" />
            <em id="home-ui-energy-x-value">0</em>
          </label>
          <label class="home-ui-row" for="home-ui-energy-y">
            <span>体力字Y</span>
            <input id="home-ui-energy-y" type="range" min="-40" max="40" step="1" value="0" />
            <em id="home-ui-energy-y-value">0</em>
          </label>
          <label class="home-ui-row" for="home-ui-coin-size">
            <span>金币字大小</span>
            <input id="home-ui-coin-size" type="range" min="14" max="42" step="1" value="24" />
            <em id="home-ui-coin-size-value">24</em>
          </label>
          <label class="home-ui-row" for="home-ui-coin-icon-x">
            <span>金币图标X</span>
            <input id="home-ui-coin-icon-x" type="range" min="-30" max="40" step="1" value="0" />
            <em id="home-ui-coin-icon-x-value">0</em>
          </label>
          <label class="home-ui-row" for="home-ui-coin-icon-y">
            <span>金币图标Y</span>
            <input id="home-ui-coin-icon-y" type="range" min="-30" max="30" step="1" value="0" />
            <em id="home-ui-coin-icon-y-value">0</em>
          </label>
          <label class="home-ui-row" for="home-ui-coin-x">
            <span>金币字X</span>
            <input id="home-ui-coin-x" type="range" min="-80" max="80" step="1" value="0" />
            <em id="home-ui-coin-x-value">0</em>
          </label>
          <label class="home-ui-row" for="home-ui-coin-y">
            <span>金币字Y</span>
            <input id="home-ui-coin-y" type="range" min="-40" max="40" step="1" value="0" />
            <em id="home-ui-coin-y-value">0</em>
          </label>

          <div class="home-ui-actions">
            <button id="home-ui-reset-btn" class="tool-btn" type="button">重置</button>
            <button id="home-ui-save-btn" class="tool-btn" type="button">保存</button>
            <button id="home-ui-close-btn" class="tool-btn" type="button">关闭</button>
          </div>
        </div>

        <div id="home-main">
          <div id="home-level-strip" aria-label="最近关卡">
            <button id="home-level-prev" class="home-level-bubble" type="button"></button>
            <button id="home-level-current" class="home-level-bubble" type="button"></button>
            <button id="home-level-next" class="home-level-bubble" type="button"></button>
          </div>

          <button id="start-btn" class="home-play-btn" type="button">PLAY</button>
        </div>

      </div>

      <div id="pause-overlay" class="layer hidden">断刀暂停 - 点一下继续</div>

      <div id="result-mask" class="hidden" aria-hidden="true"></div>
      <div id="result-page" class="layer hidden">
        <div class="result-card panel-light">
          <h2 id="result-page-title" class="result-title panel-title-ribbon is-lose"><span id="result-page-title-text">结果页</span></h2>
          <img id="result-coin-icon" class="result-coin hidden" src="./assets/images/currency128_Coin.png" alt="金币" />
          <div id="result-coin-gain" class="result-coin-gain hidden">+0</div>
          <p id="result-page-text">当前暂无统计。</p>
          <div class="result-actions">
            <button id="result-retry-btn" type="button" class="hidden" aria-label="重试"></button>
            <button id="result-exit-btn" type="button" class="hidden" aria-label="返回"></button>
            <button id="result-next-btn" type="button" class="hidden" aria-label="下一关"></button>
          </div>
        </div>
      </div>

      <div id="level-win" class="layer hidden">
        <h2 id="level-win-title">关卡胜利！</h2>
        <p id="level-win-desc">泡泡雨已放送，准备下一关。</p>
        <button id="level-win-next-btn">下一关</button>
      </div>

      <div id="game-over" class="layer hidden">
        <h2 id="game-over-title">本局结束</h2>
        <button id="restart-btn">再来一局</button>
      </div>

      <div id="app"></div>
    </div>

    <script type="module" src="./src/main.js?v=39"></script>
  </body>
</html>
