<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>切泡泡 - standalone WebGPU</title>
    <style>:root {
  --bg-1: #142130;
  --bg-2: #2a4460;
  --panel: rgba(14, 24, 39, 0.72);
  --text: #eaf4ff;
  --accent: #ffdf73;
  --button-1: #5cb2ff;
  --button-2: #3a88d8;
  --frame: #3d2616;
  --phone-aspect-base: 430 / 932;
  --phone-aspect-live: var(--phone-aspect-base);
  --ui-scale: 1;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --home-energy-text-size: 22px;
  --home-energy-text-x: 0px;
  --home-energy-text-y: 0px;
  --home-coin-text-size: 24px;
  --home-coin-icon-x: 0px;
  --home-coin-icon-y: 0px;
  --home-coin-text-x: 0px;
  --home-coin-text-y: 0px;
  --hud-width: clamp(124px, calc(156px * var(--ui-scale)), 172px);
  --hud-height: clamp(38px, calc(46px * var(--ui-scale)), 54px);
  --coin-status-width: clamp(168px, calc(208px * var(--ui-scale)), 222px);
  --coin-status-height: clamp(46px, calc(56px * var(--ui-scale)), 60px);
  --home-level-size: clamp(76px, calc(90px * var(--ui-scale)), 100px);
  --home-level-size-current: clamp(100px, calc(118px * var(--ui-scale)), 126px);
  --home-level-gap: clamp(12px, calc(18px * var(--ui-scale)), 22px);
  --home-level-strip-min-h: clamp(260px, calc(322px * var(--ui-scale)), 344px);
  --home-play-font: clamp(30px, calc(42px * var(--ui-scale)), 44px);
  --home-play-pad-y: clamp(12px, calc(16px * var(--ui-scale)), 18px);
  --home-play-pad-x: clamp(42px, calc(58px * var(--ui-scale)), 64px);
  --home-play-margin-top: clamp(12px, calc(24px * var(--ui-scale)), 28px);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Avenir Next", "Segoe UI", sans-serif;
  color: var(--text);
}

body {
  min-height: 100dvh;
  background: radial-gradient(circle at 22% 10%, #4b6f94 0%, var(--bg-2) 35%, var(--bg-1) 82%);
  display: flex;
  justify-content: center;
  align-items: center;
  padding:
    max(12px, var(--safe-top))
    max(12px, var(--safe-right))
    max(12px, var(--safe-bottom))
    max(12px, var(--safe-left));
}

#phone-frame {
  position: relative;
  width: min(
    470px,
    calc(100vw - max(12px, var(--safe-left)) - max(12px, var(--safe-right))),
    calc((100dvh - max(12px, var(--safe-top)) - max(12px, var(--safe-bottom))) * var(--phone-aspect-live))
  );
  aspect-ratio: var(--phone-aspect-live);
  height: auto;
  overflow: hidden;
  border-radius: 26px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow: 0 18px 42px rgba(0, 0, 0, 0.48);
  background: linear-gradient(180deg, #395a7b 0%, #2a4460 48%, #1a2a3d 100%);
  border: 6px solid var(--frame);
}

#app,
#app canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#coin-status {
  position: absolute;
  right: calc(12px + var(--safe-right));
  top: calc(12px + var(--safe-top));
  width: var(--coin-status-width);
  height: var(--coin-status-height);
  z-index: 17;
  background: url("../assets/images/label_Light1.png") center / 100% 100% no-repeat;
  pointer-events: none;
}

#coin-status.is-hidden-in-gameplay {
  opacity: 0;
}

#coin-status .coin-icon {
  position: absolute;
  left: 7px;
  top: 50%;
  width: clamp(34px, calc(42px * var(--ui-scale)), 46px);
  height: clamp(34px, calc(42px * var(--ui-scale)), 46px);
  object-fit: contain;
  transform: translateY(-50%);
}

#coin-status-text {
  position: absolute;
  right: clamp(10px, calc(16px * var(--ui-scale)), 18px);
  top: 50%;
  transform: translateY(-50%);
  color: #fff8d6;
  font-size: clamp(22px, calc(30px * var(--ui-scale)), 32px);
  font-weight: 900;
  line-height: 1;
  text-shadow: 0 3px 8px rgba(0, 0, 0, 0.45);
}

#coin-fly-layer {
  position: absolute;
  inset: 0;
  z-index: 27;
  pointer-events: none;
  overflow: visible;
}

.coin-fly-item {
  position: absolute;
  left: 0;
  top: 0;
  width: 72px;
  height: 72px;
  object-fit: contain;
  will-change: transform, opacity;
  pointer-events: none;
}

#hud {
  position: absolute;
  top: calc(12px + var(--safe-top));
  left: calc(12px + var(--safe-left));
  width: var(--hud-width);
  min-height: var(--hud-height);
  z-index: 17;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

#level-test {
  position: absolute;
  top: calc(12px + var(--safe-top));
  right: calc(12px + var(--safe-right));
  z-index: 13;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

.tool-btn {
  margin-top: 0;
  padding: clamp(7px, calc(8px * var(--ui-scale)), 10px) clamp(12px, calc(14px * var(--ui-scale)), 16px);
  font-size: clamp(12px, calc(13px * var(--ui-scale)), 14px);
  font-weight: 800;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  background: rgba(21, 38, 58, 0.84);
  box-shadow: 0 10px 20px rgba(8, 16, 28, 0.32);
  color: #eff8ff;
}

#level-test-panel {
  width: 176px;
  padding: 10px;
  border-radius: 12px;
  background: rgba(10, 20, 33, 0.86);
  border: 1px solid rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(8px);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#level-test-panel label {
  font-size: 12px;
  color: #cae9ff;
  font-weight: 700;
}

#level-test-select {
  width: 100%;
  border-radius: 8px;
  border: 1px solid rgba(169, 216, 255, 0.55);
  background: #f2f8ff;
  color: #1f425f;
  font-size: 12px;
  font-weight: 700;
  padding: 7px 8px;
}

#level-test-jump {
  width: 100%;
}

#title {
  font-size: 14px;
  letter-spacing: 0.08em;
  font-weight: 700;
}

#score {
  margin-top: 0;
  font-size: 21px;
  font-weight: 800;
  color: #c9585f;
  width: auto;
  text-align: center;
  transform: none;
}

#cuts,
#slice-state {
  margin-top: 4px;
  font-size: 13px;
}

#commentary {
  position: absolute;
  left: 50%;
  top: calc(18px + var(--safe-top));
  transform: translateX(-50%);
  z-index: 7;
  padding: clamp(6px, calc(8px * var(--ui-scale)), 10px) clamp(12px, calc(14px * var(--ui-scale)), 16px);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.9);
  color: #2f5f89;
  border: 1px solid rgba(92, 178, 255, 0.5);
  box-shadow: 0 8px 16px rgba(92, 178, 255, 0.25);
  font-size: clamp(11px, calc(12px * var(--ui-scale)), 13px);
  font-weight: 700;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s ease;
  max-width: calc(100% - 28px - var(--safe-left) - var(--safe-right));
}

#commentary.show {
  opacity: 1;
}

.layer {
  position: absolute;
  inset: 0;
  z-index: 12;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding:
    calc(clamp(16px, calc(24px * var(--ui-scale)), 28px) + var(--safe-top))
    calc(clamp(16px, calc(24px * var(--ui-scale)), 28px) + var(--safe-right))
    calc(clamp(16px, calc(24px * var(--ui-scale)), 28px) + var(--safe-bottom))
    calc(clamp(16px, calc(24px * var(--ui-scale)), 28px) + var(--safe-left));
}

.panel-light {
  border-radius: 22px;
  border: 1px solid rgba(255, 255, 255, 0.32);
  background: linear-gradient(180deg, rgba(255, 249, 239, 0.98), rgba(243, 230, 209, 0.95));
  box-shadow: 0 18px 28px rgba(0, 0, 0, 0.2);
}

.panel-title-ribbon {
  position: absolute;
  left: 50%;
  top: 0;
  margin: 0;
  width: min(86%, 280px);
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translate(-50%, calc(-50% - 15px));
  font-size: 32px;
  font-weight: 900;
  color: #ffffff;
  text-shadow: 0 4px 12px rgba(0, 0, 0, 0.35);
  background-position: center;
  background-repeat: no-repeat;
  background-size: 100% 100%;
}

.panel-title-ribbon span {
  transform: translateY(-5px);
}

.panel-title-ribbon.is-yellow {
  background-image: url("../assets/images/tittleRibbon_Yellow.png");
}

.panel-title-ribbon.is-red {
  background-image: url("../assets/images/tittleRibbon_Red.png");
}

#start-screen,
#game-over {
  background: rgba(232, 244, 255, 0.92);
  color: #356088;
}

#home-screen {
  z-index: 15;
  position: absolute;
  overflow: hidden;
  padding: 0;
  justify-content: space-between;
  color: #fff6ef;
  background: transparent;
}

#home-screen::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: url("../assets/images/09_aurora_gradient.png") center / cover no-repeat;
  opacity: 0.6;
}

#home-float-layer {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.home-float-bubble {
  position: absolute;
  left: var(--left);
  bottom: -16%;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, calc(var(--alpha) * 0.9));
  background: radial-gradient(circle at 30% 28%, rgba(255, 255, 255, calc(var(--alpha) * 0.34)) 0%, rgba(255, 255, 255, 0) 72%);
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, calc(var(--alpha) * 0.18)),
    0 4px 10px rgba(135, 189, 255, calc(var(--alpha) * 0.16));
  transform: translate3d(-50%, 0, 0);
  opacity: 0;
  animation: home-float-up var(--dur) linear infinite;
  animation-delay: var(--delay);
  will-change: transform, opacity;
}

.home-float-bubble::after {
  content: "";
  position: absolute;
  left: 18%;
  top: 14%;
  width: 28%;
  height: 20%;
  border-radius: 50%;
  background: rgba(255, 255, 255, calc(var(--alpha) * 0.95));
  transform: rotate(-22deg);
}

@keyframes home-float-up {
  0% {
    transform: translate3d(-50%, 0, 0) scale(0.9);
    opacity: 0;
  }
  12% {
    opacity: 0.95;
  }
  88% {
    opacity: 0.8;
  }
  100% {
    transform: translate3d(calc(-50% + var(--drift)), -132vh, 0) scale(1.06);
    opacity: 0;
  }
}

#home-topbar,
#home-main {
  position: relative;
  z-index: 1;
}

#home-topbar {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  align-items: center;
  gap: 10px;
  padding:
    calc(16px + var(--safe-top))
    calc(16px + var(--safe-right))
    8px
    calc(16px + var(--safe-left));
}

.home-status {
  position: relative;
  min-height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.5);
  background: linear-gradient(180deg, rgba(255, 246, 244, 0.95), rgba(255, 232, 226, 0.92));
  box-shadow: 0 4px 10px rgba(78, 25, 25, 0.15);
}

.home-status-badge {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 35% 30%, #ffd8de, #ff6a7f 62%, #e83f56 100%);
  color: #ffffff;
  font-size: 18px;
  font-weight: 900;
  text-shadow: 0 2px 4px rgba(118, 20, 35, 0.4);
  flex: 0 0 auto;
}

.home-status-energy .home-status-badge {
  width: auto;
  height: auto;
  left: 10px;
  border-radius: 0;
  background: none;
  color: #ef3554;
  font-size: 34px;
  line-height: 1;
  text-shadow: 0 2px 6px rgba(124, 14, 34, 0.28);
}

.home-status-badge.coin {
  border-radius: 0;
  background: none;
  width: 40px;
  height: 40px;
  object-fit: contain;
}

.home-status-coin .home-status-badge.coin {
  width: 44px;
  height: 44px;
  left: 4px;
  transform: translate(var(--home-coin-icon-x), calc(-50% + var(--home-coin-icon-y)));
  filter: drop-shadow(0 2px 5px rgba(74, 44, 0, 0.2));
}

.home-status-value {
  width: 100%;
  text-align: center;
  color: #c9585f;
  font-size: var(--home-coin-text-size);
  font-weight: 900;
  letter-spacing: 0.01em;
  line-height: 1;
  text-shadow: none;
  transform: translate(var(--home-coin-text-x), var(--home-coin-text-y));
}

.home-status-energy .home-status-value {
  font-size: var(--home-energy-text-size);
  transform: translate(var(--home-energy-text-x), var(--home-energy-text-y));
}

.home-mini-btn {
  width: 40px;
  height: 40px;
  margin: 0;
  padding: 0;
  font-size: 20px;
  border-radius: 12px;
  background: linear-gradient(180deg, #ffd6ae, #f0b27e);
  color: #5c2f12;
  box-shadow: 0 6px 0 #b9794d;
}

#home-settings-modal {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(8, 14, 22, 0.38);
}

.home-settings-card {
  width: min(86%, 320px);
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.24);
  background: rgba(15, 26, 40, 0.94);
  box-shadow: 0 14px 28px rgba(0, 0, 0, 0.34);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.home-settings-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.home-settings-header h3 {
  margin: 0;
  color: #f0f7ff;
  font-size: 20px;
  font-weight: 900;
}

.home-settings-close {
  width: 30px;
  height: 30px;
  margin: 0;
  padding: 0;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  background: rgba(255, 255, 255, 0.14);
  color: #f4fbff;
  font-size: 16px;
  line-height: 1;
}

.home-settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #d9ebff;
  font-size: 15px;
  font-weight: 800;
}

.home-settings-row input[type="checkbox"] {
  width: 22px;
  height: 22px;
}

.home-clear-data-btn {
  margin-top: 4px;
  width: 100%;
  border-radius: 12px;
  border: 1px solid rgba(255, 173, 173, 0.45);
  background: linear-gradient(180deg, #ff7f7f, #ea4f4f);
  color: #fff;
  font-size: 14px;
  font-weight: 900;
  padding: 10px 12px;
}

#home-main {
  width: 100%;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: clamp(6px, calc(8px * var(--ui-scale)), 10px);
  padding:
    clamp(16px, calc(24px * var(--ui-scale)), 28px)
    calc(clamp(16px, calc(24px * var(--ui-scale)), 28px) + var(--safe-right))
    calc(clamp(8px, calc(12px * var(--ui-scale)), 18px) + var(--safe-bottom))
    calc(clamp(16px, calc(24px * var(--ui-scale)), 28px) + var(--safe-left));
}

#home-title {
  margin: 0;
  font-size: clamp(34px, 10vw, 48px);
  color: #fff8ef;
  text-shadow: 0 5px 0 rgba(79, 36, 18, 0.5);
}

#home-subtitle {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  color: rgba(255, 240, 223, 0.92);
}

#home-level-strip {
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
  gap: var(--home-level-gap);
  margin-top: 0;
  min-height: var(--home-level-strip-min-h);
}

.home-level-bubble {
  width: var(--home-level-size);
  height: var(--home-level-size);
  margin: 0;
  padding: 0;
  border-radius: 999px;
  border: 2px solid rgba(255, 255, 255, 0.36);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(24px, calc(30px * var(--ui-scale)), 32px);
  font-weight: 900;
  letter-spacing: 0.01em;
  color: #fff;
  position: relative;
  box-shadow:
    inset -5px -10px 15px rgba(0, 0, 0, 0.16),
    inset 5px 10px 15px rgba(255, 255, 255, 0.35),
    0 12px 18px rgba(0, 0, 0, 0.25);
}

.home-level-bubble::after {
  content: "";
  position: absolute;
  top: 14px;
  left: 18px;
  width: 26px;
  height: 16px;
  background: rgba(255, 255, 255, 0.58);
  border-radius: 999px;
  transform: rotate(-25deg);
}

.home-level-bubble.passed {
  background: radial-gradient(circle at 30% 30%, #fef3c7, #d4a373);
  color: #6f462f;
}

.home-level-bubble.current {
  width: var(--home-level-size-current);
  height: var(--home-level-size-current);
  background: radial-gradient(circle at 30% 30%, #4ade80, #166534);
  animation: bubble-float 2.8s ease-in-out infinite;
}

.home-level-bubble.upcoming {
  background: radial-gradient(circle at 30% 30%, #8ec9ff, #3a6ca6);
}

.home-level-bubble.locked {
  background: radial-gradient(circle at 30% 30%, #7e7e7e, #545454);
}

.home-level-bubble.live {
  background: transparent !important;
  border: 0;
  box-shadow: none;
  color: #ffffff;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
  z-index: 2;
}

.home-level-bubble.live::after {
  display: none;
}

.home-level-bubble.live.current {
  animation: none;
}

.home-level-bubble.hard {
  background: radial-gradient(circle at 30% 30%, #c084fc, #6b21a8);
}

.home-level-bubble.medium {
  background: radial-gradient(circle at 30% 30%, #ffcc80, #f97316);
}

.home-level-bubble[disabled] {
  opacity: 0.45;
  cursor: default;
}

.home-level-tag {
  position: absolute;
  bottom: -5px;
  padding: 2px 8px;
  border-radius: 999px;
  background: #ef4444;
  color: #fff;
  font-size: 10px;
  font-weight: 900;
  border: 1px solid rgba(255, 255, 255, 0.34);
}

.home-level-tag.medium {
  background: #ea580c;
}

.home-play-btn {
  margin-top: var(--home-play-margin-top);
  padding: var(--home-play-pad-y) var(--home-play-pad-x);
  border-radius: 36px;
  font-size: var(--home-play-font);
  font-weight: 900;
  letter-spacing: 0.06em;
  background: linear-gradient(180deg, #61d96f, #20a44d);
  border-bottom: clamp(5px, calc(8px * var(--ui-scale)), 9px) solid #156d36;
  box-shadow: 0 14px 26px rgba(12, 62, 30, 0.35);
  animation: play-pulse 3.4s ease-in-out infinite;
}

@media (max-height: 760px) {
  :root {
    --home-level-gap: clamp(10px, calc(14px * var(--ui-scale)), 18px);
    --home-level-strip-min-h: clamp(232px, calc(280px * var(--ui-scale)), 310px);
    --home-play-margin-top: clamp(8px, calc(12px * var(--ui-scale)), 14px);
  }
}

@media (max-height: 700px) {
  :root {
    --home-level-size: clamp(68px, calc(82px * var(--ui-scale)), 92px);
    --home-level-size-current: clamp(90px, calc(106px * var(--ui-scale)), 114px);
    --home-level-strip-min-h: clamp(208px, calc(248px * var(--ui-scale)), 276px);
    --home-play-font: clamp(26px, calc(34px * var(--ui-scale)), 36px);
  }
}

#level-win {
  z-index: 14;
  background: rgba(232, 244, 255, 0.9);
  color: #2c5f8f;
}

#result-page {
  z-index: 19;
}

#result-mask {
  position: absolute;
  inset: 0;
  z-index: 18;
  background: rgba(34, 34, 44, 0.38);
}

.result-card {
  position: relative;
  width: min(90%, 320px);
  min-height: 250px;
  box-sizing: border-box;
  color: #6f527e;
  padding: 44px 20px 16px;
  text-align: center;
  overflow: visible;
}

.result-title {
  background-position: center;
}

.result-title.is-win {
  background-image: url("../assets/images/tittleRibbon_Yellow.png");
}

.result-title.is-lose {
  background-image: url("../assets/images/tittleRibbon_Red.png");
}

.result-card p {
  margin: 12px 0 0;
  font-weight: 700;
  line-height: 1.6;
}

.result-coin {
  position: absolute;
  left: 50%;
  top: 53%;
  width: 72px;
  height: 72px;
  object-fit: contain;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.22));
  pointer-events: none;
}

.result-coin-gain {
  position: absolute;
  left: calc(50% + 44px);
  top: 53%;
  transform: translate(0, -50%);
  color: #ffd95f;
  font-size: 44px;
  font-weight: 900;
  text-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
  pointer-events: none;
}

.result-actions {
  margin-top: 14px;
  display: flex;
  justify-content: center;
  gap: 10px;
}

.result-actions button {
  margin-top: 0;
  border-radius: 0;
  width: 152px;
  height: 152px;
  min-width: 152px;
  min-height: 152px;
  padding: 0;
  background-repeat: no-repeat;
  background-position: center;
  background-size: 76px 76px, 152px 152px;
  box-shadow: none;
  color: transparent;
  font-size: 0;
}

#result-retry-btn {
  background-image:
    url("../assets/images/iconShade_Restart.png"),
    url("../assets/images/button_5_Orange.png");
}

#result-exit-btn {
  background-image:
    url("../assets/images/iconShade_Home.png"),
    url("../assets/images/button_5_Red.png");
}

#result-next-btn {
  background-image:
    url("../assets/images/iconShade_Forward.png"),
    url("../assets/images/button_5_Green.png");
}

#level-win h2 {
  margin: 0;
  font-size: clamp(34px, 8.8vw, 52px);
  letter-spacing: 0.06em;
  text-shadow: 0 6px 16px rgba(92, 178, 255, 0.35);
}

#level-win p {
  margin: 16px 0 0;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.6;
}

#level-win-next-btn {
  margin-top: 22px;
}

#pause-overlay {
  z-index: 11;
  background: rgba(18, 30, 45, 0.44);
  color: #fff;
  font-size: 32px;
  font-weight: 800;
  text-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
}

#start-screen h1,
#game-over h2 {
  margin: 0;
  font-size: clamp(36px, 9vw, 54px);
  letter-spacing: 0.06em;
  text-shadow: 0 6px 16px rgba(92, 178, 255, 0.35);
}

#start-screen p {
  margin: 18px 0 0;
  line-height: 1.75;
  font-weight: 700;
}

button {
  margin-top: 26px;
  border: 0;
  border-radius: 999px;
  padding: 14px 34px;
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  background: linear-gradient(135deg, var(--button-1), var(--button-2));
  box-shadow: 0 12px 22px rgba(61, 137, 214, 0.35);
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}

@keyframes bubble-float {
  0%,
  100% {
    transform: translateY(0) scale(1);
  }
  50% {
    transform: translateY(-8px) scale(1.02);
  }
}

@keyframes play-pulse {
  0%,
  100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.018);
  }
}

.hidden {
  display: none !important;
}
</style>
