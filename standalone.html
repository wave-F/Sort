<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>切泡泡 - standalone WebGPU</title>
    <style>:root {
  --bg-1: #142130;
  --bg-2: #2a4460;
  --panel: rgba(14, 24, 39, 0.72);
  --text: #eaf4ff;
  --accent: #ffdf73;
  --button-1: #5cb2ff;
  --button-2: #3a88d8;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Avenir Next", "Segoe UI", sans-serif;
  color: var(--text);
}

body {
  background: radial-gradient(circle at 22% 10%, #4b6f94 0%, var(--bg-2) 35%, var(--bg-1) 82%);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
}

#phone-frame {
  position: relative;
  width: min(92vw, 450px);
  height: min(92vh, 800px);
  aspect-ratio: 9 / 16;
  overflow: hidden;
  border-radius: 26px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow: 0 18px 42px rgba(0, 0, 0, 0.48);
  background: linear-gradient(145deg, #edf4fb 0%, #dbe7f4 100%);
}

#app,
#app canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#hud {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 6;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(6px);
}

#title {
  font-size: 14px;
  letter-spacing: 0.08em;
  font-weight: 700;
}

#score {
  margin-top: 0;
  font-size: 22px;
  font-weight: 800;
  color: var(--accent);
}

#cuts,
#slice-state {
  margin-top: 4px;
  font-size: 13px;
}

#commentary {
  position: absolute;
  left: 50%;
  top: 18px;
  transform: translateX(-50%);
  z-index: 7;
  padding: 8px 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.9);
  color: #2f5f89;
  border: 1px solid rgba(92, 178, 255, 0.5);
  box-shadow: 0 8px 16px rgba(92, 178, 255, 0.25);
  font-size: 12px;
  font-weight: 700;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s ease;
}

#commentary.show {
  opacity: 1;
}

.layer {
  position: absolute;
  inset: 0;
  z-index: 12;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
}

#start-screen,
#game-over {
  background: rgba(232, 244, 255, 0.92);
  color: #356088;
}

#pause-overlay {
  z-index: 11;
  background: rgba(18, 30, 45, 0.44);
  color: #fff;
  font-size: 32px;
  font-weight: 800;
  text-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
}

#start-screen h1,
#game-over h2 {
  margin: 0;
  font-size: clamp(36px, 9vw, 54px);
  letter-spacing: 0.06em;
  text-shadow: 0 6px 16px rgba(92, 178, 255, 0.35);
}

#start-screen p {
  margin: 18px 0 0;
  line-height: 1.75;
  font-weight: 700;
}

button {
  margin-top: 26px;
  border: 0;
  border-radius: 999px;
  padding: 14px 34px;
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  background: linear-gradient(135deg, var(--button-1), var(--button-2));
  box-shadow: 0 12px 22px rgba(61, 137, 214, 0.35);
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}

.hidden {
  display: none !important;
}
</style>
  </head>
  <body>
    <div id="phone-frame">
      <div id="hud">
        <div id="score">分数: 0</div>
      </div>

      <div id="commentary">开始后，先锁定一种颜色再连戳。</div>

      <div id="start-screen" class="layer">
        <h1>切泡泡</h1>
        <p>一刀只能戳同色，碰到异色会断刀。<br />不限刀数，尽量拿高分。</p>
        <button id="start-btn">开始游戏</button>
      </div>

      <div id="pause-overlay" class="layer hidden">断刀暂停 - 点一下继续</div>

      <div id="game-over" class="layer hidden">
        <h2 id="game-over-title">本局结束</h2>
        <button id="restart-btn">再来一局</button>
      </div>

      <div id="app"></div>
    </div>
