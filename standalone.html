<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>切泡泡 - standalone WebGPU</title>
    <style>:root {
  --bg-1: #142130;
  --bg-2: #2a4460;
  --panel: rgba(14, 24, 39, 0.72);
  --text: #eaf4ff;
  --accent: #ffdf73;
  --button-1: #5cb2ff;
  --button-2: #3a88d8;
  --frame: #3d2616;
  --phone-aspect-base: 430 / 932;
  --phone-aspect-live: var(--phone-aspect-base);
  --ui-scale: 1;
  --font-scale: 1;
  --space-scale: 1;
  --title-scale: 1;
  --label-scale: 1;
  --phone-frame-width: 430px;
  --home-level-boost: 1.3;
  --home-level-offset-y: 0px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --home-energy-text-size: 22px;
  --home-energy-text-x: 0px;
  --home-energy-text-y: 0px;
  --home-coin-text-size: 24px;
  --home-coin-icon-x: 0px;
  --home-coin-icon-y: 0px;
  --home-coin-text-x: 0px;
  --home-coin-text-y: 0px;
  --hud-width: clamp(168px, calc(198px * var(--ui-scale)), 228px);
  --hud-height: clamp(38px, calc(46px * var(--ui-scale)), 54px);
  --home-level-size: clamp(76px, calc(90px * var(--ui-scale) * var(--home-level-boost)), 150px);
  --home-level-size-current: clamp(100px, calc(118px * var(--ui-scale) * var(--home-level-boost)), 189px);
  --home-level-gap: clamp(10px, calc(18px * var(--ui-scale) * var(--home-level-boost)), 30px);
  --home-level-strip-min-h: clamp(230px, calc(322px * var(--ui-scale) * var(--home-level-boost)), 380px);
  --home-play-font: clamp(30px, calc(42px * var(--ui-scale)), 44px);
  --home-play-pad-y: clamp(12px, calc(16px * var(--ui-scale)), 18px);
  --home-play-pad-x: clamp(42px, calc(58px * var(--ui-scale)), 64px);
  --home-play-margin-top: clamp(12px, calc(24px * var(--ui-scale)), 28px);
  --hud-level-offset-x: 0px;
  --sp-1: calc(4px * var(--space-scale));
  --sp-2: calc(8px * var(--space-scale));
  --sp-3: calc(12px * var(--space-scale));
  --sp-4: calc(16px * var(--space-scale));
  --sp-5: calc(20px * var(--space-scale));
  --sp-6: calc(24px * var(--space-scale));
  --fs-xs: clamp(11px, calc(12px * var(--font-scale)), 13px);
  --fs-sm: clamp(12px, calc(14px * var(--font-scale)), 16px);
  --fs-md: clamp(14px, calc(16px * var(--font-scale)), 18px);
  --fs-lg: clamp(18px, calc(22px * var(--font-scale)), 24px);
  --fs-xl: clamp(24px, calc(32px * var(--title-scale)), 40px);
  --topbar-gap: clamp(8px, calc(10px * var(--space-scale)), 12px);
  --topbar-pad-x: clamp(12px, calc(16px * var(--space-scale)), 18px);
  --topbar-pad-top: clamp(14px, calc(16px * var(--space-scale)), 18px);
  --topbar-pad-bottom: clamp(6px, calc(8px * var(--space-scale)), 10px);
  --status-height: clamp(42px, calc(46px * var(--ui-scale) * var(--space-scale)), 52px);
  --status-text-size: clamp(18px, calc(24px * var(--label-scale)), 26px);
  --control-size: clamp(36px, calc(40px * var(--space-scale)), 44px);
  --dbg-win-x: 0px;
  --dbg-win-y: 0px;
  --dbg-win-scale: 1;
  --dbg-win-width: 0px;
  --dbg-win-height: 0px;
  --dbg-title-y: 0px;
  --dbg-title-scale: 1;
  --dbg-perfect-y: 0px;
  --dbg-perfect-scale: 1;
  --dbg-reward-y: 0px;
  --dbg-reward-scale: 1;
  --dbg-actions-y: 0px;
  --dbg-continue-scale: 1;
  --dbg-coin-num-x: 0px;
  --dbg-coin-num-y: 0px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Avenir Next", "Segoe UI", sans-serif;
  color: var(--text);
}

body {
  min-height: 100dvh;
  background: radial-gradient(circle at 22% 10%, #4b6f94 0%, var(--bg-2) 35%, var(--bg-1) 82%);
  display: flex;
  justify-content: center;
  align-items: center;
  padding:
    max(12px, var(--safe-top))
    max(12px, var(--safe-right))
    max(12px, var(--safe-bottom))
    max(12px, var(--safe-left));
}

#phone-frame {
  position: relative;
  width: min(
    470px,
    calc(100vw - max(12px, var(--safe-left)) - max(12px, var(--safe-right))),
    calc((100dvh - max(12px, var(--safe-top)) - max(12px, var(--safe-bottom))) * var(--phone-aspect-live))
  );
  aspect-ratio: var(--phone-aspect-live);
  height: auto;
  overflow: hidden;
  border-radius: 26px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow: 0 18px 42px rgba(0, 0, 0, 0.48);
  background: linear-gradient(180deg, #395a7b 0%, #2a4460 48%, #1a2a3d 100%);
  border: 6px solid var(--frame);
}

#app,
#app canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#gameplay-topbar {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  z-index: 17;
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  align-items: center;
  gap: var(--topbar-gap);
  padding:
    calc(var(--topbar-pad-top) + var(--safe-top))
    calc(var(--topbar-pad-x) + var(--safe-right))
    var(--topbar-pad-bottom)
    calc(var(--topbar-pad-x) + var(--safe-left));
  pointer-events: none;
}

#gameplay-topbar.is-floating-over-result {
  z-index: 30;
}

#gameplay-topbar.is-floating-over-continue {
  z-index: 33;
}

#gameplay-coin-status {
  min-height: var(--status-height);
  width: 100%;
}

.gameplay-topbar-spacer {
  min-height: 1px;
}

.gameplay-topbar-right {
  width: var(--control-size);
}

#gameplay-coin-status.is-hidden-in-gameplay {
  opacity: 0;
}

#coin-fly-layer {
  position: absolute;
  inset: 0;
  z-index: 27;
  pointer-events: none;
  overflow: visible;
}

.coin-fly-item {
  position: absolute;
  left: 0;
  top: 0;
  width: 72px;
  height: 72px;
  object-fit: contain;
  will-change: transform, opacity;
  pointer-events: none;
}

#hud {
  position: absolute;
  top: calc(12px + var(--safe-top));
  left: calc(12px + var(--safe-left));
  z-index: 17;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  padding: 0;
}

.gameplay-hud-item {
  min-width: clamp(118px, calc(138px * var(--ui-scale)), 156px);
  min-height: var(--hud-height);
  padding: 0 12px;
}

#gameplay-settings-mask {
  position: absolute;
  inset: 0;
  z-index: 17;
  background: rgba(8, 12, 20, 0.36);
  backdrop-filter: blur(1px);
}

#gameplay-settings {
  position: absolute;
  top: calc(var(--sp-3) + var(--safe-top));
  right: calc(var(--sp-3) + var(--safe-right));
  z-index: 18;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 5px;
}

.gp-settings-btn {
  width: calc(var(--control-size) + var(--sp-1));
  height: calc(var(--control-size) + var(--sp-1));
  border-radius: clamp(12px, calc(14px * var(--space-scale)), 16px);
  border: 2px solid rgba(93, 62, 25, 0.42);
  background: linear-gradient(180deg, #ffd7af, #f0b37f);
  color: #ffffff;
  font-size: clamp(19px, calc(22px * var(--label-scale)), 24px);
  font-weight: 900;
  letter-spacing: 0.01em;
  box-shadow: 0 6px 0 #b9794d, 0 10px 18px rgba(78, 45, 17, 0.34);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.gp-main-btn {
  width: calc(var(--control-size) + var(--sp-1));
  font-size: clamp(19px, calc(22px * var(--label-scale)), 24px);
}

.gp-settings-icon {
  transform: translateY(-1px);
  line-height: 1;
}

.gp-settings-item {
  opacity: 0;
  transform: translateY(10px) scale(0.94);
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.2s ease;
}

#gameplay-settings.open .gp-settings-item {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

#gameplay-settings.open .gp-settings-item:nth-of-type(2) {
  transition-delay: 0ms;
}

#gameplay-settings.open .gp-settings-item:nth-of-type(3) {
  transition-delay: 70ms;
}

#gameplay-settings.open .gp-settings-item:nth-of-type(4) {
  transition-delay: 140ms;
}

.gp-settings-btn.is-off {
  background: linear-gradient(180deg, #cfc2b4, #a39281);
  color: rgba(255, 255, 255, 0.72);
  border-color: rgba(102, 84, 66, 0.42);
  box-shadow: 0 6px 0 #7b6756, 0 10px 18px rgba(70, 52, 36, 0.3);
}

.gp-exit-btn {
  background: linear-gradient(180deg, #ff9898, #eb5a5a);
  border-color: rgba(169, 36, 36, 0.56);
  box-shadow: 0 7px 0 rgba(125, 35, 35, 0.62), 0 10px 20px rgba(94, 26, 26, 0.35);
}

#gameplay-exit-mask {
  position: absolute;
  inset: 0;
  z-index: 28;
  background: rgba(12, 20, 32, 0.42);
  backdrop-filter: blur(1px);
}

#gameplay-exit-modal {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(86%, 348px);
  z-index: 29;
  border-radius: 28px;
  border: 3px solid rgba(214, 152, 96, 0.98);
  background: linear-gradient(180deg, rgba(255, 246, 235, 0.98), rgba(251, 234, 212, 0.97));
  box-shadow: 0 10px 0 rgba(166, 107, 56, 0.72), 0 22px 40px rgba(18, 26, 44, 0.34);
  padding: 16px 14px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.gameplay-exit-close {
  margin: 0;
  position: absolute;
  right: -12px;
  top: -12px;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 3px solid #f8b43a;
  background: linear-gradient(180deg, #ff9f9f, #ea5353);
  color: #fff9f9;
  font-size: 24px;
  font-weight: 900;
  line-height: 1;
  padding: 0 0 2px;
  box-shadow: 0 5px 0 rgba(145, 39, 45, 0.68);
}

.gameplay-exit-title {
  width: min(90%, 286px);
  min-height: 56px;
  border-radius: 18px;
  border: 3px solid #f0b04a;
  background: linear-gradient(180deg, #fff9f2, #ffe9cc);
  box-shadow: 0 5px 0 rgba(186, 125, 67, 0.72);
  color: #7d3f1f;
  font-size: 28px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
}

.gameplay-exit-inner {
  width: 100%;
  border-radius: 22px;
  border: 2px solid rgba(212, 165, 118, 0.9);
  background: linear-gradient(180deg, #fffdfa, #f7efe3);
  padding: 18px 12px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.gameplay-exit-icon {
  width: 86px;
  height: 86px;
  border-radius: 50%;
  border: 2px solid rgba(222, 176, 126, 0.96);
  background: radial-gradient(circle at 30% 26%, #fff4e6, #ffe3be 70%, #ffd6a1 100%);
  box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.75);
  color: #b85e2b;
  font-size: 48px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.gameplay-exit-inner p {
  margin: 0;
  color: #7a4623;
  font-size: 22px;
  font-weight: 900;
  text-align: center;
}

.gameplay-exit-actions {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.gameplay-exit-cancel,
.gameplay-exit-confirm {
  width: 100%;
  min-height: 48px;
  margin-top: 0;
  padding: 8px 10px;
  border-radius: 999px;
  border: 3px solid #efaf47;
  color: #fffaf8;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 0 rgba(97, 14, 31, 0.45);
}

.gameplay-exit-cancel {
  background: linear-gradient(180deg, #ffcc8d, #f2a861);
  box-shadow: 0 6px 0 rgba(162, 103, 47, 0.72), 0 8px 16px rgba(93, 57, 24, 0.28);
  color: #753717;
  text-shadow: 0 1px 0 rgba(255, 246, 230, 0.68);
}

.gameplay-exit-confirm {
  background: linear-gradient(180deg, #ff6f6f, #e43a3a);
  box-shadow: 0 6px 0 rgba(146, 40, 44, 0.72), 0 8px 16px rgba(93, 28, 30, 0.28);
}

#gameplay-exit-modal:not(.hidden) {
  animation: gameplay-exit-pop 160ms ease-out;
}

@keyframes gameplay-exit-pop {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.95);
  }
  100% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}

#level-test {
  position: fixed;
  top: calc(74px + var(--safe-top));
  right: calc(12px + var(--safe-right));
  z-index: 40;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

.tool-btn {
  margin-top: 0;
  padding: clamp(7px, calc(8px * var(--ui-scale)), 10px) clamp(12px, calc(14px * var(--ui-scale)), 16px);
  font-size: clamp(12px, calc(13px * var(--ui-scale)), 14px);
  font-weight: 800;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  background: rgba(21, 38, 58, 0.84);
  box-shadow: 0 10px 20px rgba(8, 16, 28, 0.32);
  color: #eff8ff;
}

#level-test-panel {
  width: 220px;
  padding: 10px;
  border-radius: 12px;
  background: rgba(10, 20, 33, 0.86);
  border: 1px solid rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(8px);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#level-test-panel label {
  font-size: 12px;
  color: #cae9ff;
  font-weight: 700;
}

#level-test-select {
  width: 100%;
  border-radius: 8px;
  border: 1px solid rgba(169, 216, 255, 0.55);
  background: #f2f8ff;
  color: #1f425f;
  font-size: 12px;
  font-weight: 700;
  padding: 7px 8px;
}

#level-test-next-step,
#level-test-export-step {
  width: 100%;
}

.level-test-group {
  margin: 2px 0 0;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid rgba(169, 216, 255, 0.35);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.level-test-group legend {
  padding: 0 6px;
  font-size: 12px;
  color: #cae9ff;
  font-weight: 700;
}

.level-test-switch {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #cae9ff;
  font-size: 12px;
  font-weight: 700;
}

.level-test-switch input {
  margin: 0;
}

#title {
  font-size: 14px;
  letter-spacing: 0.08em;
  font-weight: 700;
}

#score {
  margin-top: 0;
  font-size: clamp(18px, calc(21px * var(--label-scale)), 24px);
  font-weight: 800;
  color: #c9585f;
  width: auto;
  text-align: center;
  transform: none;
}

#hud-level {
  margin-top: 0;
  font-size: clamp(18px, calc(21px * var(--label-scale)), 24px);
  font-weight: 800;
  color: #c9585f;
  text-align: center;
  white-space: nowrap;
  line-height: 1;
  transform: translateX(var(--hud-level-offset-x));
}


#cuts,
#slice-state {
  margin-top: 4px;
  font-size: 13px;
}

#level-guide {
  position: absolute;
  inset: 0;
  z-index: 9;
  pointer-events: none;
}

.gameplay-center-tip {
  position: absolute;
  left: 50%;
  top: 27%;
  transform: translate(-50%, -50%);
  padding: 12px 20px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.65);
  background: rgba(70, 24, 24, 0.92);
  color: #fff5f5;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 0.02em;
  line-height: 1;
  box-shadow: 0 8px 20px rgba(50, 10, 10, 0.34);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.16s ease, transform 0.16s ease;
  z-index: 34;
}

.gameplay-center-tip.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1.02);
}

.level-guide-tip {
  position: absolute;
  left: 0;
  top: 0;
  transform: translate(-50%, -50%);
  width: min(84%, 280px);
  padding: 8px 12px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.65);
  background: rgba(70, 24, 24, 0.92);
  color: #fff5f5;
  font-size: clamp(14px, calc(16px * var(--label-scale)), 18px);
  font-weight: 900;
  letter-spacing: 0.01em;
  line-height: 1.26;
  text-align: center;
  white-space: normal;
  word-break: break-word;
  box-shadow: 0 8px 20px rgba(50, 10, 10, 0.34);
  opacity: 0;
  transition: opacity 0.16s ease, transform 0.16s ease;
}

.level-guide-tip.is-warning {
  left: 50%;
  top: calc(132px + var(--safe-top));
  width: min(88%, 336px);
  max-width: none;
  padding: 10px 12px;
  border-radius: 14px;
  line-height: 1.26;
  white-space: normal;
  word-break: break-word;
}

.level-guide-tip.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1.02);
}

.level-guide-hand {
  position: absolute;
  left: 0;
  top: 0;
  width: clamp(68px, calc(84px * var(--ui-scale)), 92px);
  height: auto;
  transform: translate(-50%, -50%) scale(1);
  filter: drop-shadow(0 3px 8px rgba(45, 22, 8, 0.35));
  transition: transform 0.08s linear;
  user-select: none;
  -webkit-user-drag: none;
}

#out-of-moves-banner {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  z-index: 26;
  min-height: 92px;
  border-top: 4px solid #f0b04a;
  border-bottom: 4px solid #e59d37;
  background:
    linear-gradient(180deg, rgba(255, 170, 170, 0.18), rgba(255, 170, 170, 0) 26%),
    linear-gradient(180deg, #b5214b, #941a3f 56%, #811637 100%);
  box-shadow:
    inset 0 2px 0 rgba(255, 210, 182, 0.45),
    inset 0 -2px 0 rgba(93, 12, 37, 0.5),
    0 16px 30px rgba(38, 8, 19, 0.42);
  color: #fff7df;
  font-size: min(clamp(20px, calc(34px * var(--title-scale)), 40px), calc((var(--phone-frame-width) - 20px) / 8.4));
  font-weight: 900;
  letter-spacing: 0.005em;
  line-height: 1;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 10px;
  text-shadow: 0 3px 0 rgba(110, 32, 18, 0.9), 0 8px 14px rgba(0, 0, 0, 0.24);
  pointer-events: none;
}

#out-of-moves-banner.show {
  animation: out-of-moves-banner 1.8s cubic-bezier(0.22, 0.82, 0.22, 1) both;
}

@keyframes out-of-moves-banner {
  0% {
    transform: translateY(-260%);
    opacity: 0;
  }
  24% {
    transform: translateY(-50%);
    opacity: 1;
  }
  62% {
    transform: translateY(-50%);
    opacity: 1;
  }
  100% {
    transform: translateY(220%);
    opacity: 0;
  }
}

#out-of-moves-continue-mask {
  position: absolute;
  inset: 0;
  z-index: 31;
  background: rgba(24, 16, 20, 0.54);
  backdrop-filter: blur(2px);
}

#out-of-moves-continue-modal {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: 32;
  width: min(calc(100% - 24px), 340px);
  transform: translate(-50%, -50%);
  overflow: visible;
  animation: out-of-moves-continue-pop 180ms ease-out;
}

.out-of-moves-continue-body {
  position: relative;
  width: 100%;
  border-radius: 26px;
  border: 3px solid #f0b04a;
  background: #7d1338;
  box-shadow: 0 12px 0 rgba(114, 26, 50, 0.72), 0 24px 44px rgba(20, 9, 16, 0.46);
  color: #fff7df;
  overflow: hidden;
}

.out-of-moves-continue-close {
  position: absolute;
  right: -12px;
  top: -12px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 3px solid #f4ba4f;

.home-float-bubble {
  position: absolute;
  left: var(--left);
  bottom: -16%;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, calc(var(--alpha) * 0.9));
  background: radial-gradient(circle at 30% 28%, rgba(255, 255, 255, calc(var(--alpha) * 0.34)) 0%, rgba(255, 255, 255, 0) 72%);
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, calc(var(--alpha) * 0.18)),
    0 4px 10px rgba(135, 189, 255, calc(var(--alpha) * 0.16));
  transform: translate3d(-50%, 0, 0);
  opacity: 0;
  animation: home-float-up var(--dur) linear infinite;
  animation-delay: var(--delay);
  will-change: transform, opacity;
}

.home-float-bubble::after {
  content: "";
  position: absolute;
  left: 18%;
  top: 14%;
  width: 28%;
  height: 20%;
  border-radius: 50%;
  background: rgba(255, 255, 255, calc(var(--alpha) * 0.95));
  transform: rotate(-22deg);
}

@keyframes home-float-up {
  0% {
    transform: translate3d(-50%, 0, 0) scale(0.9);
    opacity: 0;
  }
  12% {
    opacity: 0.95;
  }
  88% {
    opacity: 0.8;
  }
  100% {
    transform: translate3d(calc(-50% + var(--drift)), -132vh, 0) scale(1.06);
    opacity: 0;
  }
}
