<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>刀切水果 - standalone WebGPU</title>
    <style>:root {
  --bg-1: #f4d7de;
  --bg-2: #d8adc2;
  --panel: rgba(102, 75, 110, 0.42);
  --panel-slice-top: 28;
  --panel-slice-right: 28;
  --panel-slice-bottom: 28;
  --panel-slice-left: 28;
  --result-card-width: 320px;
  --result-card-height: 260px;
  --result-card-y: 0px;
  --result-actions-y: 0px;
  --result-actions-scale: 1;
  --result-coin-x: 0px;
  --result-coin-y: 0px;
  --result-coin-scale: 1;
  --result-gain-x: 0px;
  --result-gain-y: 0px;
  --result-gain-size: 44px;
  --result-mask-opacity: 0.38;
  --coin-bar-x: 0px;
  --coin-bar-y: 0px;
  --coin-bar-scale: 1;
  --coin-icon-x: 0px;
  --coin-icon-y: 0px;
  --coin-icon-scale: 1;
  --coin-text-x: 0px;
  --coin-text-y: 0px;
  --coin-text-size: 34px;
  --control-panel-x: 0px;
  --text: #fff6fb;
  --accent: #ffdf73;
  --button-1: #ff66be;
  --button-2: #f0679a;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Avenir Next", "Segoe UI", sans-serif;
  color: var(--text);
}

body {
  background: radial-gradient(circle at 30% 8%, #f6dce3 0%, var(--bg-1) 42%, var(--bg-2) 92%);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
}

#phone-frame {
  position: relative;
  width: min(92vw, 450px);
  height: min(92vh, 800px);
  aspect-ratio: 9 / 16;
  overflow: hidden;
  border-radius: 26px;
  border: 1px solid rgba(255, 255, 255, 0.28);
  box-shadow: 0 18px 42px rgba(73, 39, 74, 0.36);
  background: linear-gradient(180deg, #ebc3d2 0%, #f2d0d6 50%, #f0d2c8 100%);
}

#bg-art {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.bg-sky,
.bg-lane,
.bg-hills,
.bg-forest {
  position: absolute;
  inset: 0;
}

.bg-sky {
  background:
    radial-gradient(120px 42px at 18% 38%, rgba(255, 236, 241, 0.5), rgba(255, 236, 241, 0) 70%),
    radial-gradient(150px 46px at 74% 44%, rgba(255, 236, 241, 0.46), rgba(255, 236, 241, 0) 72%),
    linear-gradient(180deg, #d8afc2 0%, #dcb4c8 58%, #efcdc3 100%);
}

.bg-lane {
  left: 38%;
  width: 24%;
  right: auto;
  border-left: 2px solid rgba(108, 78, 109, 0.42);
  border-right: 2px solid rgba(108, 78, 109, 0.42);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.1) 100%),
    linear-gradient(180deg, transparent 0%, transparent 56%, rgba(88, 186, 228, 0.95) 56%, rgba(78, 176, 224, 0.98) 100%);
}

.bg-lane::before {
  content: "";
  position: absolute;
  left: 18%;
  top: 0;
  width: 13%;
  height: 100%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.34) 0%, rgba(255, 255, 255, 0.16) 100%);
}

.bg-hills {
  background:
    radial-gradient(72% 18% at 50% 70%, rgba(244, 220, 205, 0.9), rgba(244, 220, 205, 0) 72%),
    radial-gradient(90% 20% at 40% 82%, rgba(231, 184, 186, 0.78), rgba(231, 184, 186, 0) 72%),
    radial-gradient(86% 22% at 62% 88%, rgba(222, 156, 174, 0.68), rgba(222, 156, 174, 0) 74%);
}

.bg-forest {
  top: auto;
  height: 23%;
  background:
    linear-gradient(180deg, rgba(56, 46, 93, 0) 0%, rgba(50, 41, 88, 0.92) 35%, rgba(44, 36, 76, 0.98) 100%),
    radial-gradient(72px 44px at 8% 44%, #2f2759 0%, #2f2759 58%, rgba(47, 39, 89, 0) 60%),
    radial-gradient(80px 48px at 18% 38%, #2d2657 0%, #2d2657 56%, rgba(45, 38, 87, 0) 58%),
    radial-gradient(86px 52px at 84% 32%, #332b60 0%, #332b60 54%, rgba(51, 43, 96, 0) 56%),
    radial-gradient(80px 46px at 94% 40%, #352d62 0%, #352d62 56%, rgba(53, 45, 98, 0) 58%);
}

#app,
#app canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 2;
}

.panel-light {
  border: 18px solid transparent;
  border-image-source: url("../assets/images/panel_Light1.png");
  border-image-slice: var(--panel-slice-top) var(--panel-slice-right) var(--panel-slice-bottom) var(--panel-slice-left) fill;
  border-image-width: 18px;
  border-image-repeat: stretch;
  overflow: visible;
}

#hud {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 6;
  padding: 4px 8px;
  min-width: 164px;
}

#control-btn {
  position: absolute;
  right: 12px;
  top: 12px;
  z-index: 24;
  margin: 0;
  padding: 10px 18px;
  font-size: 15px;
}

#coin-status {
  position: absolute;
  right: 12px;
  top: 12px;
  width: 256px;
  height: 64px;
  z-index: 17;
  background: url("../assets/images/label_Light1.png") center / 256px 64px no-repeat;
  transform: translate(var(--coin-bar-x), var(--coin-bar-y)) scale(var(--coin-bar-scale));
  transform-origin: top right;
  pointer-events: none;
}

#coin-status.on-result-win {
  z-index: 19;
}

#coin-status-icon {
  position: absolute;
  left: 6px;
  top: 50%;
  width: 52px;
  height: 52px;
  object-fit: contain;
  transform: translate(calc(var(--coin-icon-x)), calc(-50% + var(--coin-icon-y))) scale(var(--coin-icon-scale));
  transform-origin: center;
}

#coin-status-text {
  position: absolute;
  right: 18px;
  top: 50%;
  color: #fff8d6;
  font-size: var(--coin-text-size);
  font-weight: 900;
  line-height: 1;
  text-shadow: 0 2px 6px rgba(53, 35, 63, 0.45);
  transform: translate(var(--coin-text-x), calc(-50% + var(--coin-text-y)));
}

#control-blocker {
  position: absolute;
  inset: 0;
  z-index: 25;
  background: rgba(32, 20, 40, 0.24);
}

#control-panel {
  position: absolute;
  right: 12px;
  top: 70px;
  width: min(84vw, 320px);
  max-height: calc(100% - 86px);
  z-index: 26;
  padding: 12px 12px 12px;
  color: #6f527e;
  transform: translateX(var(--control-panel-x));
  overflow-x: visible;
  overflow-y: auto;
  background-color: rgba(255, 242, 250, 0.45);
  backdrop-filter: blur(4px);
  opacity: 0.72;
}

#control-panel::-webkit-scrollbar {
  width: 8px;
}

#control-panel::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.2);
  border-radius: 999px;
}

#control-panel::-webkit-scrollbar-thumb {
  background: rgba(111, 82, 126, 0.55);
  border-radius: 999px;
}

#control-panel .control-group {
  background: rgba(255, 245, 251, 0.2);
  border-color: rgba(118, 85, 124, 0.22);
}

#control-panel .control-group legend {
  opacity: 0.86;
}

#control-panel .control-row {
  opacity: 0.9;
}

#control-panel input[type="range"] {
  opacity: 0.78;
}

#control-panel button {
  opacity: 0.76;
}

.panel-title-ribbon {
  position: absolute;
  left: 50%;
  top: 0;
  margin: 0;
  width: min(86%, 280px);
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translate(-50%, calc(-50% - 15px));
  font-size: 32px;
  font-weight: 900;
  color: #ffffff;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
  background-position: center;
  background-repeat: no-repeat;
  background-size: 100% 100%;
}

.panel-title-ribbon.is-yellow {
  background-image: url("../assets/images/tittleRibbon_Yellow.png");
}

.panel-title-ribbon.is-red {
  background-image: url("../assets/images/tittleRibbon_Red.png");
}

.control-row {
  display: grid;
  grid-template-columns: 70px 1fr 34px;
  align-items: center;
  gap: 8px;
  margin: 6px 0;
  font-size: 12px;
  font-weight: 700;
}

.control-row input {
  width: 100%;
}

.control-row em {
  font-style: normal;
  text-align: right;
}

.control-text-row {
  display: grid;
  grid-template-columns: 64px 1fr;
  align-items: center;
  gap: 8px;
  margin: 6px 0;
  font-size: 12px;
  font-weight: 700;
}

.control-text-row input {
  width: 100%;
  height: 30px;
  border-radius: 8px;
  border: 1px solid rgba(118, 85, 124, 0.3);
  background: rgba(255, 255, 255, 0.52);
  color: #5f4b69;
  padding: 0 8px;
}

.control-group {
  margin: 8px 0 2px;
  padding: 8px 10px 6px;
  border: 1px solid rgba(118, 85, 124, 0.34);
  border-radius: 10px;
  background: rgba(255, 245, 251, 0.22);
}

.control-group legend {
  padding: 0 6px;
  font-size: 12px;
  font-weight: 800;
  color: #6f527e;
}

.control-group-actions {
  margin-top: 8px;
  display: flex;
  justify-content: flex-end;
}

.control-group-actions button {
  margin-top: 0;
  padding: 8px 14px;
  font-size: 14px;
}

.control-actions {
  margin-top: 10px;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.control-actions button {
  margin-top: 0;
  padding: 8px 14px;
  font-size: 14px;
}

#title {
  font-size: 14px;
  letter-spacing: 0.08em;
  font-weight: 700;
}

#score {
  margin-top: 0;
  font-size: 22px;
  font-weight: 800;
  color: var(--accent);
}

.trail-test-toggle {
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  opacity: 0.95;
  user-select: none;
}

.trail-test-toggle input {
  width: 14px;
  height: 14px;
  accent-color: #4e9be6;
}

#cuts,
#slice-state {
  margin-top: 4px;
  font-size: 13px;
}

#commentary {
  position: absolute;
  left: 50%;
  top: 18px;
  transform: translateX(-50%);
  z-index: 7;
  padding: 0 12px;
  color: #6f527e;
  font-size: 12px;
  font-weight: 700;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s ease;
}

#hud,
#commentary {
  border: 16px solid transparent;
  border-image-source: url("../assets/images/panel_Light1.png");
  border-image-slice: var(--panel-slice-top) var(--panel-slice-right) var(--panel-slice-bottom) var(--panel-slice-left) fill;
  border-image-width: 16px;
  border-image-repeat: stretch;
}

#commentary.show {
  opacity: 1;
}

.layer {
  position: absolute;
  inset: 0;
  z-index: 12;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
}

#start-screen,
#game-over {
  background: rgba(232, 244, 255, 0.92);
  color: #356088;
}

#start-screen {
  padding: 0;
  justify-content: flex-end;
  background: linear-gradient(180deg, rgba(223, 178, 196, 0.32) 0%, rgba(209, 155, 179, 0.2) 55%, rgba(109, 73, 122, 0.2) 100%);
}

.ladder-stage {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: stretch;
}

.ladder-rail {
  position: absolute;
  left: 50%;
  top: 6%;
  transform: translateX(-50%);
  width: 25%;
  height: 82%;
  border-left: 3px solid rgba(112, 87, 123, 0.56);
  border-right: 3px solid rgba(112, 87, 123, 0.56);
  background: linear-gradient(180deg, rgba(255, 235, 246, 0.12) 0%, rgba(255, 235, 246, 0.06) 100%);
  overflow: hidden;
}

.ladder-rail-shine {
  position: absolute;
  left: 16%;
  top: 0;
  width: 14%;
  height: 100%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.36) 0%, rgba(255, 255, 255, 0.08) 100%);
}

.ladder-nodes {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 8%;
  height: calc(4 * 88px + 3 * 22px);
  padding: 0 8px;
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
  gap: 22px;
  overflow: hidden;
}

.ladder-node {
  flex: 0 0 auto;
  width: 80px;
  height: 74px;
  border: 0;
  background-image: url("../assets/images/button_5_White.png");
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
  color: #5c637b;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 46px;
  font-weight: 800;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
}

.ladder-node.is-passed {
  background-image: url("../assets/images/button_5_Yellow.png");
  color: #ffffff;
}

.ladder-node.is-current {
  background-image: url("../assets/images/button_5_Green.png");
  color: #ffffff;
  box-shadow:
    0 0 0 4px rgba(255, 210, 86, 0.32),
    0 0 26px rgba(255, 214, 102, 0.8);
}

#start-btn {
  position: absolute;
  left: 50%;
  bottom: 8.5%;
  transform: translateX(-50%);
  margin-top: 0;
  min-width: 220px;
  z-index: 2;
  background: linear-gradient(180deg, #ff71cd 0%, #ef66a8 100%);
  box-shadow: 0 12px 22px rgba(134, 67, 130, 0.42);
}

#pause-overlay {
  z-index: 11;
  background: rgba(18, 30, 45, 0.44);
  color: #fff;
  font-size: 32px;
  font-weight: 800;
  text-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
}

.game-over-card {
  position: relative;
  min-width: 250px;
  max-width: 84%;
  color: #6f527e;
  padding: 44px 18px 14px;
  overflow: visible;
}

#result-page {
  z-index: 19;
}

#result-mask {
  position: absolute;
  inset: 0;
  z-index: 18;
  background: rgba(34, 34, 44, var(--result-mask-opacity));
}

.result-card {
  position: relative;
  width: min(90%, var(--result-card-width));
  height: var(--result-card-height);
  box-sizing: border-box;
  color: #6f527e;
  padding: 44px 20px 16px;
  text-align: center;
  transform: translateY(var(--result-card-y));
  overflow: visible;
}

.result-title {
  background-position: center;
}

.panel-title-ribbon span {
  transform: translateY(-5px);
}

.result-title.is-win {
  background-image: url("../assets/images/tittleRibbon_Yellow.png");
}

.result-title.is-lose {
  background-image: url("../assets/images/tittleRibbon_Red.png");
}

.result-card p {
  margin: 10px 0 0;
  font-weight: 700;
}

.result-coin {
  position: absolute;
  left: 50%;
  top: 52%;
  width: 72px;
  height: 72px;
  object-fit: contain;
  transform: translate(calc(-50% + var(--result-coin-x)), calc(-50% + var(--result-coin-y))) scale(var(--result-coin-scale));
  filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.22));
  pointer-events: none;
}

.result-coin-gain {
  position: absolute;
  left: calc(50% + 44px);
  top: 52%;
  transform: translate(calc(var(--result-gain-x)), calc(-50% + var(--result-gain-y)));
  color: #ffd95f;
  font-size: var(--result-gain-size);
  font-weight: 900;
  text-shadow: 0 3px 10px rgba(56, 34, 10, 0.55);
  pointer-events: none;
}

.result-actions {
  margin-top: 12px;
  display: flex;
  justify-content: center;
  gap: 10px;
  transform: translateY(var(--result-actions-y)) scale(var(--result-actions-scale));
  transform-origin: center top;
}

.result-actions button {
  margin-top: 0;
  min-width: 110px;
}

#result-retry-btn,
#result-exit-btn,
#result-next-btn {
  border-radius: 0;
  min-width: 132px;
  min-height: 62px;
  padding: 10px 18px;
  background-repeat: no-repeat;
  background-position: center;
  background-size: 100% 100%;
  box-shadow: none;
}

#result-retry-btn {
  background-image:
    url("../assets/images/iconShade_Restart.png"),
    url("../assets/images/button_5_Orange.png");
  width: 256px;
  height: 256px;
  min-width: 256px;
  min-height: 256px;
  padding: 0;
  background-size: 128px 128px, 256px 256px;
  background-position: center, center;
  color: transparent;
  font-size: 0;
}

#result-exit-btn {
  background-image:
    url("../assets/images/iconShade_Home.png"),
    url("../assets/images/button_5_Red.png");
  width: 256px;
  height: 256px;
  min-width: 256px;
  min-height: 256px;
  padding: 0;
  background-size: 128px 128px, 256px 256px;
  background-position: center, center;
  color: transparent;
  font-size: 0;
}

#result-next-btn {
  background-image:
    url("../assets/images/iconShade_Forward.png"),
    url("../assets/images/button_5_Green.png");
  width: 256px;
  height: 256px;
  min-width: 256px;
  min-height: 256px;
  padding: 0;
  background-size: 128px 128px, 256px 256px;
  background-position: center, center;
  color: transparent;
  font-size: 0;
}

#start-screen h1,
#game-over h2:not(.panel-title-ribbon) {
  margin: 0;
  font-size: clamp(36px, 9vw, 54px);
  letter-spacing: 0.06em;
  text-shadow: 0 6px 16px rgba(92, 178, 255, 0.35);
}

#start-screen p {
  margin: 18px 0 0;
  line-height: 1.75;
  font-weight: 700;
}

button {
  margin-top: 26px;
  border: 0;
  border-radius: 999px;
  padding: 14px 34px;
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  background: linear-gradient(135deg, var(--button-1), var(--button-2));
  box-shadow: 0 12px 22px rgba(61, 137, 214, 0.35);
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}

.hidden {
  display: none !important;
}
</style>
  </head>
  <body>
    <div id="phone-frame">
      <div id="hud">
        <div id="score">分数: 0</div>
      </div>

      <div id="commentary">开始后，先锁定一种颜色再连切。</div>

      <div id="start-screen" class="layer">
        <h1>刀切水果</h1>
        <p>一刀只能切同色，碰到异色会断刀。<br />不限刀数，尽量拿高分。</p>
        <button id="start-btn">开始游戏</button>
      </div>

      <div id="pause-overlay" class="layer hidden">断刀暂停 - 点一下继续</div>

      <div id="game-over" class="layer hidden">
        <h2 id="game-over-title">本局结束</h2>
        <button id="restart-btn">再来一局</button>
      </div>
