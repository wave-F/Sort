<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>刀切水果 - 1号版 (three.js + WebGPU)</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="phone-frame">
      <div id="hud">
        <div id="title">刀切水果</div>
        <div id="score">分数: 0</div>
        <div id="cuts">刀数: 0 / 10</div>
        <div id="slice-state">状态: 待机</div>
      </div>

      <div id="commentary">开始后，先锁定一种颜色再连切。</div>

      <div id="start-screen" class="layer">
        <h1>刀切水果</h1>
        <p>一刀只能切同色，碰到异色会断刀。<br />总共只有 10 刀，尽量拿高分。</p>
        <button id="start-btn">开始游戏</button>
      </div>

      <div id="pause-overlay" class="layer hidden">断刀暂停 - 点一下继续</div>

      <div id="game-over" class="layer hidden">
        <h2 id="game-over-title">本局结束</h2>
        <button id="restart-btn">再来一局</button>
      </div>

      <div id="app"></div>
    </div>

    <script type="module" src="./src/main.js?v=1-webgpu"></script>
  </body>
</html>
